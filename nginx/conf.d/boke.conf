server {
    listen 80;
    server_name liujixiang.de5.net;

    # WordPress 根目录（标准路径）
    root /var/www/html;
    index index.php index.html index.htm;

    # 上传大小限制（.wpress 文件 57MB，设置为 100M 更安全）
    client_max_body_size 2048M;

    # WordPress 固定链接支持
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP 脚本转发到 WordPress 容器的 PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass wordpress:9000;  # 使用 wordpress 容器

        # 超时设置（导入大文件时很重要）
        fastcgi_read_timeout 300;
    }

    # 安全性: 禁止访问隐藏文件
    location ~ /\.[^/]+ { deny all; }

    location /nginx_status {
        stub_status on;
        allow 172.16.0.0/12;
        deny all;
    }
}
