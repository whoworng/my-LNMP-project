# Redis 配置模板 (可选服务)。如启用服务请在 docker-compose.yml 取消注释。

bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# TODO: 如在公网或不可信网络使用，请设置密码并限制访问来源
# requirepass your_strong_password_here

databases 16
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
dir /data

maxmemory-policy noeviction

