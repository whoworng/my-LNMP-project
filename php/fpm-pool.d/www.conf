; PHP-FPM Pool 配置 (www)
; 常用参数已给出建议值；根据并发和资源调整。

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20          ; TODO: 根据内存/并发调整
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; 慢日志
request_slowlog_timeout = 5s
slowlog = /var/log/php/php-fpm-slow.log

; 状态与 ping (按需开启, 对外暴露需注意安全)
;pm.status_path = /fpm-status
;ping.path = /ping

; 环境变量示例
env[TZ] = ${TZ}

