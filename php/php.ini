; PHP 配置模板 — 根据业务与环境修改
; 复制到容器: /usr/local/etc/php/php.ini (docker-compose 已挂载)

[PHP]
; TODO: 修改为你的时区
date.timezone = ${TZ}

; 资源限制 (视业务调整)
memory_limit = 512M
post_max_size = 2048M      ; TODO: 提升上传表单限制时同步调整
upload_max_filesize = 2048M
max_execution_time = 0
max_input_vars = 600

; 错误显示 (开发建议 On, 线上 Off)
display_errors = On      ; TODO: 生产环境改为 Off
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php/php-error.log

; Opcache (生产建议开启)
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; 扩展: xdebug (开发调试用 — 默认注释)
; 使用方法：
; 1) 在 `.env` 设置 XDEBUG_MODE=develop,debug
; 2) 取消下一行注释启用扩展
; 3) 如需 IDE 调试，设置 xdebug.client_host 为宿主机 IP
;zend_extension=xdebug
;xdebug.mode=${XDEBUG_MODE}
;xdebug.start_with_request=yes
;xdebug.client_host=host.docker.internal ; Linux 可改为宿主机网卡 IP
;xdebug.client_port=9003

